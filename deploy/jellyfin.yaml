apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 20m
  dependsOn:
    - name: storage
    - name: syncthing
  sourceRef:
    kind: GitRepository
    name: k0s-home
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: components/jellyfin
  prune: true
  timeout: 10m
