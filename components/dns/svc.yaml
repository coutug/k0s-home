apiVersion: v1
kind: Service
metadata:
  name: coredns-home
  labels:
    exposure: tailnet
  annotations:
    lbipam.cilium.io/ips: 10.250.0.15
spec:
  type: LoadBalancer
  selector:
    app: coredns-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
