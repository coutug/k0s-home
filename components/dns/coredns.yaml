apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
spec:
  interval: 24h
  url: https://coredns.github.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns-home
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: coredns
      version: 1.46.0
      sourceRef:
        kind: HelmRepository
        name: coredns
      interval: 24h
  releaseName: coredns-home
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: values-coredns-home
