apiVersion: v1
kind: Service
metadata:
  name: hermes
  labels:
    exposure: tailnet
  annotations:
    lbipam.cilium.io/ips: 10.250.0.13
spec:
  type: LoadBalancer
  selector:
    app: hermes
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
    - name: dashboard
      port: 9119
      targetPort: dashboard
