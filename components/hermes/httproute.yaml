apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
spec:
  hostnames:
    - hermes.home
  parentRefs:
    - name: tailnet
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dash
      backendRefs:
        - name: hermes
          port: 9119
