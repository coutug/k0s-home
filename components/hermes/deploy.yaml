apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: nousresearch/hermes-agent:v2026.4.30
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          envFrom:
            - secretRef:
                name: hermes-env
          ports:
            - name: gateway
              containerPort: 8642
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: dashboard
          image: nousresearch/hermes-agent:v2026.4.30
          imagePullPolicy: IfNotPresent
          # TODO: replace localhost-only dashboard access with authenticated access.
          args:
            - dashboard
            - --host
            - 127.0.0.1
            - --no-open
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
          ports:
            - name: dashboard
              containerPort: 9119
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
