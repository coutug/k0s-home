syncthing {
    address: "127.0.0.1:8384"
    api_key: "PLACEHOLDER_REPLACE_WITH_SYNCTHING_API_KEY"
}

pattern {
    # TODO: replace with allowed device IPs, using /32 CIDR notation.
    accept_cidr: "192.168.1.10/32"
    accept_cidr: "192.168.1.11/32"

    settings {
        max_send_kbps: 0
        max_recv_kbps: 0
        num_connections: 1
        max_request_kib: 1024
    }

    # TODO: add folder blocks once synchronized folders are known.
}

garbage_collect {
    run_every_s: 86400
    unseen_devices_days: 90
    unshared_folders: true
}
